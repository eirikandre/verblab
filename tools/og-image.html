<!doctype html>
<!--
  Kilde til public/og-image.png – bildet som vises når lenken deles.
  Lag det på nytt ved å åpne denne fila i en nettleser på 1200×630 og ta
  skjermbilde av vinduet (f.eks. npm run dev → http://localhost:8000/tools/og-image.html).
-->
<html lang="nb">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f6fb;
    color: #16172a;
    display: grid;
    grid-template-columns: 1fr 440px;
    gap: 56px;
    align-items: center;
    padding: 72px 80px;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute; inset: 0 auto 0 0; width: 14px;
    background: #4338ca;
  }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
  .mark {
    width: 64px; height: 64px; border-radius: 18px;
    background: #4338ca; color: #fff;
    display: grid; place-items: center;
    font-size: 26px; font-weight: 800; letter-spacing: 1px;
  }
  .name { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  h1 { font-size: 64px; line-height: 1.05; font-weight: 800; letter-spacing: -1.5px; }
  p { margin-top: 24px; font-size: 26px; line-height: 1.35; color: #5d6180; }
  .url { margin-top: 40px; font-size: 22px; font-weight: 600; color: #4338ca; }

  .card {
    background: #fff;
    border: 2px solid #e3e5f0;
    border-radius: 24px;
    box-shadow: 0 2px 4px rgba(20,22,50,.06), 0 16px 40px rgba(20,22,50,.10);
    padding: 28px 32px;
  }
  .head, .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .head { font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #8a8fab; padding-bottom: 14px; }
  .row { font-size: 28px; font-weight: 600; padding: 14px 0; border-top: 2px solid #e3e5f0; }
  .row span:not(:first-child) { color: #4338ca; }
  .row.ok span:last-child { color: #12805c; }
</style>
</head>
<body>
  <div>
    <div class="brand"><span class="mark">VL</span><span class="name">VerbLab</span></div>
    <h1>Øv på uregelrette engelske verb</h1>
    <p>Flervalg, skriv selv og sykkelspill – gratis og uten innlogging.</p>
    <div class="url">verblab.eidsa.no</div>
  </div>
  <div class="card">
    <div class="head"><span>Infinitiv</span><span>Preteritum</span><span>Perfektum</span></div>
    <div class="row"><span>buy</span><span>bought</span><span>bought</span></div>
    <div class="row"><span>think</span><span>thought</span><span>thought</span></div>
    <div class="row"><span>fight</span><span>fought</span><span>fought</span></div>
    <div class="row"><span>go</span><span>went</span><span>gone</span></div>
  </div>
</body>
</html>
