server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript;
    gzip_min_length 256;

    # Nye verb legges ofte inn i app.min.js (fast navn, ingen hash), så ingenting
    # caches lenger enn ett døgn
    add_header Cache-Control "public, max-age=86400" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
